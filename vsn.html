<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSN</title>
    <link rel="stylesheet" href="vsn.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script nomodule src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer-legacy.js"></script>
</head>
<body>
    <div class="hamburger-menu">
        <input id="menu__toggle" type="checkbox" />
        <label class="menu__btn" for="menu__toggle">
            <span></span>
        </label>
        <ul class="menu__box">
            <li><a class="menu__item" href="index.html">HOME</a></li>
            <li><a class="menu__item" href="music.html">SND</a></li>
            <li><a class="menu__item" href="lab.html">LAB</a></li>
            <li><a class="menu__item" href="vsn.html">VSN</a></li>
        </ul>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="loop-video" loop autoplay muted playsinline>
            <source src="VIDEO/video2.mp4" type="video/mp4">
        </video>
        <p class="video-text">CLICK TO VIEW VSN</p>
    </div>

    <div class="image-gallery">
        
        <div class="model-item">
            <h3 class="image-title">LOVE EVERYONE</h3>
            <model-viewer 
                src="3D/loveveryone3d.glb" 
                alt="Modello 3D Love Everyone"
                auto-rotate 
                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ios-src="3D/loveveryone3d.glb">
            </model-viewer>
        </div>

        <div class="model-item">
            <h3 class="image-title">HATE EVERYONE</h3>
            <model-viewer 
                src="3D/hateveryone3d.glb" 
                alt="Modello 3D Hate Everyone"
                auto-rotate 
                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ios-src="3D/hateveryone3d.glb">
            </model-viewer>
        </div>

        <div class="model-item">
            <h3 class="image-title">LAUNDRY</h3>
            <model-viewer 
                src="3D/laundry3d.glb" 
                alt="Modello 3D Laundry"
                auto-rotate 
                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ios-src="3D/laundry3d.glb">
            </model-viewer>
        </div>

        <div class="model-item">
            <h3 class="image-title">ECHOES OF NOTHING</h3>
            <model-viewer 
                src="3D/echoesofnothing3d.glb" 
                alt="Modello 3D Echoes of Nothing"
                auto-rotate 
                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ios-src="3D/echoesofnothing3d.glb">
            </model-viewer>
        </div>

        <div class="model-item">
            <h3 class="image-title">NOISE</h3>
            <model-viewer 
                src="3D/noise3d.glb" 
                alt="Modello 3D Noise"
                auto-rotate 
                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ios-src="3D/noise3d.glb">
            </model-viewer>
        </div>

    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer'); 
        const imageGallery = document.querySelector('.image-gallery'); 

        videoContainer.addEventListener('click', () => {
            imageGallery.classList.toggle('visible'); 
        });

        const menuToggle = document.getElementById('menu__toggle');
        const menuBox = document.querySelector('.menu__box');

        menuToggle.addEventListener('change', () => {
            if (menuToggle.checked) {
                menuBox.style.visibility = 'visible';
                menuBox.style.left = '0';
            } else {
                menuBox.style.visibility = 'hidden';
                menuBox.style.left = '-100%';
            }
        });
    </script>
</body>
</html>
