    <div class="video-container" id="videoContainer">
        <video id="loop-video" loop autoplay muted playsinline>
            <source src="VIDEO/video2.mp4" type="video/mp4">
        </video>
        <p class="video-text">SCROLL TO VIEW VSN</p>
    </div>

    <div class="image-gallery">
        
        <div class="model-item">
            <h3 class="image-title">LOVE EVERYONE</h3>
            <model-viewer

                alt="Modello 3D Love Everyone"

                camera-controls
                shadow-intensity="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
